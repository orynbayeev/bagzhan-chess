/*
VOICE: Apple-минимализм BAGZHAN AI — светлый воздух, чёрный текст, один градиент.
IDEA: настоящий шахматный стол: доска в центре, часы и бланк записи партии сбоку.
PICTURE: сама доска — большая, живая, с перетаскиванием, стрелками и оценкой.
COLOUR and TYPE: #F5F5F7 / #1D1D1F, градиент #0A84FF→#5E5CE6, доска #EEF0F6 + #98A5C4; Inter.
LAYOUT: слева узкое меню, по центру доска с карточками игроков, справа панель режима; на телефоне всё в колонку.
*/
:root{color-scheme:light;--bg:#F5F5F7;--panel:#FFFFFF;--panel2:#F2F2F5;--line:#E8E8ED;--ink:#1D1D1F;--mute:#6E6E73;--acc:#0A84FF;--acc2:#5E5CE6;--accd:#0060D0;--grad:linear-gradient(90deg,#0A84FF,#5E5CE6);--lt:#EEF0F6;--dk:#98A5C4;--hl:rgba(10,132,255,.30);--red:#FF3B30}
:root{--card:#fff;--solid:#1D1D1F;--onsolid:#fff;--glass:rgba(245,245,247,.92);--glass2:rgba(255,255,255,.85);--stripe:#FAFAFB;--okbg:#E4F1FF;--okfg:#0060D0;--badbg:#FFE9E7;--badfg:#C4271D;--swoff:#D1D1D6;--phover:#DCEBFF;--losebg:#1D1D1F;--neg:#1D1D1F;--shadow:rgba(29,29,31,.14)}
:root[data-mode=dark]{color-scheme:dark;--bg:#000;--panel:#1C1C1E;--panel2:#2C2C2E;--line:#38383A;--ink:#F5F5F7;--mute:#98989D;--card:#1C1C1E;--solid:#F5F5F7;--onsolid:#000;--glass:rgba(0,0,0,.82);--glass2:rgba(28,28,30,.85);--stripe:#232325;--okbg:#0B2A4A;--okfg:#64B5FF;--badbg:#3A1512;--badfg:#FF8A80;--swoff:#48484A;--phover:#1E3A5F;--losebg:#2C2C2E;--neg:#000;--shadow:rgba(0,0,0,.6)}
:root[data-mode=dark][data-board=apple]{--lt:#C5CCDC;--dk:#7684A5}
:root[data-mode=dark] .capt i{filter:drop-shadow(0 0 1px rgba(255,255,255,.75))}
:root[data-mode=dark] .av,:root[data-mode=dark] .tile .ti{box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
:root[data-board=green]{--lt:#ebecd0;--dk:#739552;--hl:rgba(255,255,51,.5)}
:root[data-board=brown]{--lt:#f0d9b5;--dk:#b58863}
:root[data-board=blue]{--lt:#dee3e6;--dk:#8ca2ad}
:root[data-board=grey]{--lt:#d9d9d9;--dk:#8f8f8f}
:root[data-board=purple]{--lt:#e8e1f2;--dk:#8877b7}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;letter-spacing:-.01em;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.app{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:100vh}
nav.side{background:var(--card);padding:14px 10px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;font-weight:700;font-size:19px;letter-spacing:-.04em}
.logo svg{width:34px;height:34px;flex:none}
.logo b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.nb{display:flex;align-items:center;gap:12px;padding:11px 12px;border:0;background:none;border-radius:12px;font-weight:600;font-size:15px;text-align:left;color:var(--ink);min-height:44px;touch-action:manipulation}
.nb svg{width:24px;height:24px;flex:none}
.nb:hover{background:var(--panel2)}
.nb.on{background:var(--solid);color:var(--onsolid)}
.side .foot{margin-top:auto;color:var(--mute);font-size:12px;padding:8px}
main{padding:18px clamp(10px,2vw,28px);display:grid;grid-template-columns:minmax(0,auto) minmax(300px,400px);gap:20px;align-items:start;justify-content:center}
.boardcol{display:flex;flex-direction:column;gap:8px;width:min(calc(100vh - 150px),calc(100vw - 680px),760px);min-width:300px}
.brow{display:flex;gap:8px;align-items:stretch}
.evalbar{width:22px;flex:none;border-radius:8px;background:#3A3A3C;position:relative;overflow:hidden;display:none}
.evalbar.on{display:block}
.evalbar i{position:absolute;left:0;right:0;bottom:0;background:#fff;transition:height .5s ease}
.evalbar span{position:absolute;left:0;right:0;font-size:10px;font-weight:800;text-align:center;z-index:2}
.evalbar .et{top:4px;color:#fff}.evalbar .eb{bottom:4px;color:#3A3A3C}
.board{position:relative;aspect-ratio:1;width:100%;border-radius:14px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;box-shadow:0 20px 50px var(--shadow)}
.sqs{position:absolute;inset:0;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr)}
.sq{position:relative}
.sq.l{background:var(--lt)}.sq.d{background:var(--dk)}
.sq.last::after,.sq.sel::after{content:"";position:absolute;inset:0;background:var(--hl)}
.sq.mark::after{content:"";position:absolute;inset:0;background:rgba(235,97,80,.8)}
.sq.chk{background:radial-gradient(circle,#ff2a2a 0%,rgba(231,0,0,.6) 40%,transparent 75%),var(--sqc)}
.sq.l.chk{--sqc:var(--lt)}.sq.d.chk{--sqc:var(--dk)}
.sq.dot::before{content:"";position:absolute;left:35%;top:35%;width:30%;height:30%;border-radius:50%;background:rgba(0,0,0,.14);z-index:3}
.sq.cap::before{content:"";position:absolute;inset:3%;border-radius:50%;border:6px solid rgba(0,0,0,.14);z-index:3}
.sq.hov{box-shadow:inset 0 0 0 4px rgba(255,255,255,.65)}
.co{position:absolute;font-size:clamp(9px,1.4vw,13px);font-weight:700;z-index:2;pointer-events:none}
.co.r{left:3px;top:2px}.co.f{right:4px;bottom:1px}
.sq.l .co{color:var(--dk)}.sq.d .co{color:var(--lt)}
.pcs{position:absolute;inset:0;pointer-events:none}
.pc{position:absolute;width:12.5%;height:12.5%;background-size:100%;background-repeat:no-repeat;z-index:5;will-change:transform}
.pc.anim{transition:transform .16s ease}
.pc.drag{z-index:20;transition:none;cursor:grabbing;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
.board svg.arr{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:15}
.pauseov{position:absolute;inset:0;z-index:40;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:20px}
.pauseov.on{display:flex}
.pauseov b{font-size:clamp(34px,7vw,56px);line-height:.98;letter-spacing:-.045em}
.pauseov span{color:var(--mute);font-weight:500}
.pauseov .big{width:auto;padding:14px 34px;margin-top:14px}
.promo{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:30;display:none;align-items:center;justify-content:center}
.promo.on{display:flex}
.promo div{display:flex;gap:6px;background:var(--card);border-radius:16px;padding:6px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.promo button{width:clamp(52px,9vw,84px);aspect-ratio:1;border:0;border-radius:12px;background:var(--panel2) center/90% no-repeat}
.promo button:hover{background-color:var(--phover)}
.pl{display:flex;align-items:center;gap:10px;min-height:46px}
.av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:17px;flex:none;color:#fff}
.pn{font-weight:700;font-size:15px;line-height:1.2}
.pn small{color:var(--mute);font-weight:600;margin-left:4px}
.capt{height:18px;display:flex;align-items:center;gap:0;font-size:12px;color:var(--mute);font-weight:700}
.capt i{width:16px;height:16px;background-size:100%;margin-right:-5px;display:inline-block;opacity:.9}
.capt b{margin-left:9px}
.clock{margin-left:auto;background:var(--card);color:#86868B;font:700 22px/1 Inter,-apple-system,sans-serif;letter-spacing:-.02em;font-variant-numeric:tabular-nums;padding:10px 14px;border-radius:12px;min-width:112px;text-align:right}
.clock.run{background:var(--solid);color:var(--onsolid)}
.clock.low.run{background:#FF3B30;color:#fff}
.clock.off{display:none}
.think{font-size:12px;color:var(--acc);font-weight:700;display:none}
.think.on{display:inline}
aside.panel{background:var(--panel);border-radius:20px;box-shadow:0 10px 40px rgba(29,29,31,.06);display:flex;flex-direction:column;max-height:calc(100vh - 36px);position:sticky;top:18px;overflow:hidden}
.ph{padding:16px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);font-weight:700;font-size:19px;letter-spacing:-.03em}
.ph svg{width:26px;height:26px}
.pb{position:relative;padding:14px 16px;overflow:auto;flex:1}
.pf{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.lbl{font-size:13px;font-weight:600;color:var(--mute);margin:14px 0 8px}
.lbl:first-child{margin-top:0}
.bots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.bot{border:2px solid transparent;background:var(--panel2);border-radius:14px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;min-height:70px}
.bot .av{width:34px;height:34px;font-size:14px}
.bot.on{border-color:var(--acc)}
.botinfo{display:flex;gap:12px;align-items:center;background:var(--panel2);border-radius:14px;padding:10px;margin-top:8px}
.botinfo .av{width:52px;height:52px;font-size:22px}
.botinfo p{margin:2px 0 0;color:var(--mute);font-size:13px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;border:0;background:var(--panel2);border-radius:999px;padding:9px 14px;font-weight:600;font-size:14px;min-height:42px;white-space:nowrap}
.seg button.on{background:var(--solid);color:var(--onsolid)}
.big{width:100%;border:0;border-radius:999px;background:var(--grad);color:#fff;font-weight:700;font-size:19px;letter-spacing:-.02em;padding:15px;box-shadow:0 10px 30px rgba(10,132,255,.28);margin-top:16px;min-height:56px;transition:transform .12s,box-shadow .12s}
.big:hover{box-shadow:0 14px 36px rgba(94,92,230,.35)}
.big:active{transform:scale(.98)}
.btn{border:0;background:var(--panel2);border-radius:999px;padding:9px 14px;font-weight:600;font-size:14px;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:1 1 auto}
.btn:hover{background:var(--line)}
.btn.g{background:var(--grad);color:#fff}
.btn svg{width:18px;height:18px}
.moves{position:relative;display:grid;grid-template-columns:42px 1fr 1fr;font-size:14px;font-weight:600}
.moves .n{color:var(--mute);padding:4px 8px}
.moves .m{padding:4px 8px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:5px}
.moves .m:hover{background:var(--panel2)}
.moves .m.cur{background:var(--solid)!important;color:var(--onsolid)}
.moves .rw:nth-child(6n+1),.moves .rw:nth-child(6n+2),.moves .rw:nth-child(6n+3){background:var(--stripe)}
.tag{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;font-size:10px;font-weight:800;color:#fff;flex:none}
.nav{display:flex;gap:6px;padding:10px 16px;border-top:1px solid var(--line)}
.nav .btn{flex:1}
.status{background:var(--panel2);border-radius:14px;padding:10px 12px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.status.ok{background:var(--okbg);color:var(--okfg)}.status.bad{background:var(--badbg);color:var(--badfg)}
.lines{display:flex;flex-direction:column;gap:4px;font-size:13px;margin-bottom:10px}
.lines div{background:var(--panel2);border-radius:10px;padding:6px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lines b{display:inline-block;min-width:48px;padding:1px 6px;border-radius:6px;margin-right:6px;text-align:center;background:#fff;color:#1D1D1F}
.lines b.neg{background:var(--neg);color:#fff}
textarea{width:100%;min-height:70px;background:var(--panel2);border:0;border-radius:12px;padding:8px;font-size:13px;resize:vertical}
.big-n{font-size:40px;font-weight:700;line-height:1;letter-spacing:-.045em}
.rev{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;font-size:14px;font-weight:600;align-items:center}
.rev .h{color:var(--mute);font-size:12px}
.acc{display:flex;gap:10px;margin-bottom:12px}
.acc div{flex:1;background:var(--panel2);border-radius:14px;padding:10px;text-align:center}
.acc div b{display:block;font-size:28px;font-weight:700;letter-spacing:-.04em}
.acc .w b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}.acc .bk b{color:var(--ink)}
.prog{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin:6px 0 12px}
.prog i{display:block;height:100%;background:var(--grad);width:0;transition:width .2s}
.modal{position:fixed;inset:0;background:rgba(29,29,31,.28);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal.on{display:flex}
.card{background:var(--panel);border-radius:24px;width:min(380px,100%);overflow:hidden;box-shadow:0 30px 80px rgba(29,29,31,.25)}
.card .top{background:linear-gradient(135deg,#0A84FF,#5E5CE6);color:#fff;padding:26px 20px;text-align:center}
.card .top.lose{background:var(--losebg)}
.card h2{margin:0;font-size:32px;line-height:1;letter-spacing:-.045em}
.card .top p{margin:8px 0 0;color:rgba(255,255,255,.8);font-weight:500}
.card .body{padding:16px;display:flex;flex-direction:column;gap:8px}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-weight:600}
.set select{background:var(--panel2);border:0;border-radius:10px;padding:8px;min-height:40px;font-size:16px}
.sw{width:46px;height:26px;border-radius:13px;background:var(--swoff);border:0;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:#34C759}.sw.on::after{left:23px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--solid);color:var(--onsolid);padding:11px 18px;border-radius:999px;font-weight:700;opacity:0;transition:.2s;z-index:200;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.hint{color:var(--mute);font-size:13px;margin:8px 0 0}
.mobnav{display:none}
.page{display:none;grid-column:1/-1;width:100%;max-width:980px;margin:0 auto}
body.pagemode .boardcol,body.pagemode aside.panel{display:none}
body.pagemode .page{display:block}
.hero{background:var(--card);border-radius:24px;padding:clamp(22px,4vw,40px);display:flex;gap:18px;align-items:center;margin-bottom:16px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;right:-120px;bottom:-200px;width:480px;height:480px;border-radius:50%;filter:blur(80px);opacity:.45;background:radial-gradient(circle at 35% 40%,#0A84FF,transparent 60%),radial-gradient(circle at 65% 60%,#5E5CE6,transparent 60%);pointer-events:none}
.hero>*{position:relative}
.grad{display:block;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:4px}
.hero .av{width:64px;height:64px;font-size:28px;border-radius:18px;flex:none}
.hero h1{margin:0;font-size:clamp(30px,5vw,48px);line-height:.98;letter-spacing:-.045em;font-weight:700}
.hero p{margin:10px 0 0;color:var(--mute);font-weight:500;font-size:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,calc(50% - 6px)),1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--panel);border:0;border-radius:20px;padding:20px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:130px;transition:transform .15s,box-shadow .15s;color:#fff}
.tile:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(29,29,31,.08)}
.tile .ti{color:#fff;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;margin-bottom:6px}
.tile .ti svg{width:24px;height:24px}
.tile b{font-size:19px;color:var(--ink);letter-spacing:-.03em}.tile span{color:var(--mute);font-size:13px;font-weight:600}
.box{background:var(--panel);border-radius:20px;padding:20px;margin-bottom:16px}
.box h3{margin:0 0 14px;font-size:20px;letter-spacing:-.035em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stats div{background:var(--panel2);border-radius:14px;padding:14px}
.stats small{display:block;color:var(--mute);font-weight:600;font-size:12px}
.stats b{font-size:30px;font-weight:700;letter-spacing:-.045em}
.hist{display:flex;flex-direction:column;gap:6px}
.hrow{display:grid;grid-template-columns:30px minmax(0,1fr) auto auto;gap:10px;align-items:center;background:var(--panel2);border-radius:14px;padding:8px 10px;font-weight:600;font-size:14px}
.hrow .r{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff}
.hrow small{color:var(--mute);display:block;font-size:12px}
.hrow .btn{min-height:36px;padding:6px 10px;font-size:13px}
.login{position:fixed;inset:0;z-index:300;background:radial-gradient(circle at 80% 100%,rgba(94,92,230,.35),transparent 45%),radial-gradient(circle at 20% 90%,rgba(10,132,255,.3),transparent 45%),var(--bg);display:none;align-items:center;justify-content:center;padding:max(20px,env(safe-area-inset-top)) 18px max(20px,env(safe-area-inset-bottom));overflow:auto}
.login.on{display:flex}
.login .lc{width:min(420px,100%);display:flex;flex-direction:column;gap:12px}
.login .logo{justify-content:center;font-size:28px;padding:0 0 6px}.login .logo svg{width:56px;height:56px}
.login h2{margin:0;text-align:center;font-size:40px;line-height:.98;letter-spacing:-.045em}
.login p{margin:0;text-align:center;color:var(--mute);font-weight:600}
.inp{width:100%;background:var(--card);border:2px solid transparent;border-radius:14px;padding:13px 14px;font-size:17px;font-weight:600}
.inp:focus{border-color:var(--acc);outline:0}
.colors{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.colors button{width:40px;height:40px;border-radius:50%;border:3px solid transparent}
.colors button.on{border-color:var(--ink)}
.lvl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lvl button{background:var(--card);border:2px solid transparent;border-radius:14px;padding:10px 6px;font-weight:600;font-size:14px}
.lvl button small{display:block;color:var(--mute);font-size:11px;font-weight:600}
.lvl button.on{border-color:var(--acc)}
@media (prefers-reduced-motion:reduce){.pc.anim,.evalbar i{transition:none}}
@media(max-width:1100px){
 .app{grid-template-columns:64px minmax(0,1fr)}
 .logo span,.nb span,.side .foot{display:none}
 .logo{padding:6px 4px 16px;justify-content:center}.nb{justify-content:center;padding:10px}
 .boardcol{width:min(calc(100vh - 150px),calc(100vw - 520px),760px)}
}
@media(max-width:860px){
 .app{grid-template-columns:1fr}
 nav.side{display:none}
 .mobnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--glass2);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);padding:4px 4px max(4px,env(safe-area-inset-bottom));gap:2px}
 .mobnav .logo,.mobnav .nb-set{display:none}
 .mobnav .nb{flex:1;flex-direction:column;justify-content:center;font-size:11px;gap:2px;padding:6px 2px;min-height:52px;color:#8E8E93}
 .mobnav .nb.on{background:none;color:var(--acc)}
 .mobnav .nb svg{width:24px;height:24px}
 main{padding-top:max(8px,env(safe-area-inset-top))!important;padding-bottom:calc(72px + env(safe-area-inset-bottom))!important}
 body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:60}
 .boardcol{gap:4px}
 .pl{min-height:34px;gap:8px;padding:0 2px}
 .pl .av{width:30px;height:30px;font-size:13px;border-radius:9px}
 .pn{font-size:13px}.pn small{font-size:11px}
 .capt{height:14px;font-size:11px}.capt i{width:13px;height:13px;margin-right:-4px}
 .clock{font-size:17px;min-width:74px;padding:6px 10px;border-radius:9px}
 .brow{gap:5px}
 .evalbar{width:12px;border-radius:6px}.evalbar span{font-size:7px}
 .board{border-radius:10px;box-shadow:0 10px 26px rgba(29,29,31,.12)}
 aside.panel{border-radius:16px}
 .ph{padding:9px 14px;font-size:15px;gap:8px}.ph svg{width:20px;height:20px}.ph .av{width:24px!important;height:24px!important;font-size:11px!important;border-radius:7px}
 .pb{padding:8px 12px}
 .nav{padding:6px 12px;gap:5px}.nav .btn{min-height:34px;padding:4px}
 .pf{padding:8px 12px;gap:6px}
 .btn{min-height:36px;padding:6px 10px;font-size:13px}.btn svg{width:16px;height:16px}
 .moves{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:2px;align-items:center;font-size:13px;scrollbar-width:none;padding-bottom:2px}
 .moves::-webkit-scrollbar{display:none}
 .moves .rw{background:none!important;flex:none}
 .moves .n{padding:3px 0 3px 6px}.moves .m{padding:3px 7px;white-space:nowrap}
 .moves .m:empty{display:none}
 .status{padding:7px 10px;margin-bottom:6px;font-size:13px;border-radius:10px}
 .lines{gap:3px;font-size:12px;margin-bottom:6px}.lines div{padding:4px 7px;border-radius:8px}.lines b{min-width:40px}
 .lbl{margin:8px 0 5px;font-size:12px}
 .acc{margin-bottom:8px;gap:6px}.acc div{padding:6px;border-radius:10px}.acc div b{font-size:21px}
 .rev{font-size:12px;gap:2px 10px}
 .big{min-height:46px;font-size:16px;padding:11px;margin-top:10px}
 .seg button{min-height:36px;padding:6px 10px;font-size:13px}
 .bot{min-height:58px;border-radius:11px}.bot .av{width:28px!important;height:28px!important;font-size:12px!important}
 .botinfo{padding:7px;margin-top:6px}.botinfo .av{width:40px;height:40px;font-size:17px}.botinfo p{font-size:12px}
 details summary{font-size:13px}
 .hint{font-size:12px}
 main{grid-template-columns:minmax(0,1fr);padding:8px 6px 24px;gap:10px}
 .boardcol{width:100%;min-width:0;max-width:600px;margin:0 auto}
 aside.panel{position:static;max-height:none}
 .clock{font-size:19px;min-width:92px;padding:7px 10px}
}
@media(max-width:420px){.bots{grid-template-columns:repeat(5,minmax(0,1fr))}.bot{font-size:10px}}

  <input class="inp" id="lName" maxlength="20" placeholder="Ваше имя" value="${esc(profile?profile.name:'')}" autocomplete="nickname">
  <div class="colors" id="lCol">${AVC.map(c=>`<button data-c="${c}" class="${c===col?'on':''}" style="background:${c}" aria-label="цвет"></button>`).join('')}</div>
  ${edit?'':`<p style="margin-top:6px">Ваш уровень</p><div class="lvl" id="lLvl"><button data-l="new" class="${lvl==='new'?'on':''}">Новичок<small>только учусь</small></button><button data-l="mid" class="${lvl==='mid'?'on':''}">Любитель<small>знаю тактику</small></button><button data-l="pro" class="${lvl==='pro'?'on':''}">Опытный<small>играю давно</small></button></div>`}
  <button class="big" id="lGo">${edit?'Сохранить':'Начать'}</button>${edit?'<button class="btn" id="lCancel">Отмена</button>':''}</div>`;
  $('#lCol').onclick=e=>{const b=e.target.closest('button');if(b){col=b.dataset.c;const n=$('#lName').value;draw();$('#lName').value=n}};
  const lv=$('#lLvl');if(lv)lv.onclick=e=>{const b=e.target.closest('button');if(b){lvl=b.dataset.l;const n=$('#lName').value;draw();$('#lName').value=n}};
  const c=$('#lCancel');if(c)c.onclick=()=>L.classList.remove('on');
  $('#lGo').onclick=()=>{const name=$('#lName').value.trim();if(!name){$('#lName').focus();toast('Введите имя');return}
   const first=!profile;profile={name,color:col,level:lvl,since:profile&&profile.since||Date.now()};store.set('profile',profile);syncMe();
   if(first){Play.cfg.bot={new:1,mid:3,pro:5}[lvl];Puzzles.rating={new:800,mid:1200,pro:1600}[lvl];store.set('prating',Puzzles.rating);store.set('playcfg',Play.cfg)}
   L.classList.remove('on');go(first?'home':curView||'home')}};
 draw();L.classList.add('on');setTimeout(()=>{try{$('#lName').focus()}catch(e){}},50)}

/* ---------- навигация ---------- */
const VIEWS={home:Home,play:Play,puzzles:Puzzles,analysis:Analysis,profile:Profile,settings:Settings};
let curView=null;
function go(v){if(!VIEWS[v])v='play';if(curView&&VIEWS[curView].leave)VIEWS[curView].leave();
 if(curView==='settings'&&v!=='settings'&&false);
 const prevPlay=curView;curView=v;document.querySelectorAll('.nb').forEach(b=>b.classList.toggle('on',b.dataset.v===v||(v==='settings'&&b.dataset.v==='profile'&&b.closest('.mobnav'))));
 document.body.classList.toggle('pagemode',!!VIEWS[v].page);if(v!=='analysis')setEval(null,false);VIEWS[v].enter();window.scrollTo(0,0)
 if(location.hash!=='#'+v)try{history.replaceState(null,'','#'+v)}catch(e){location.hash=v}}
const mob=document.querySelector('.mobnav');document.querySelectorAll('nav.side .nb').forEach(b=>mob.appendChild(b.cloneNode(true)));
document.addEventListener('pointerdown',()=>{try{if(settings.sound){actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}}catch(e){}},{passive:true});
document.addEventListener('click',e=>{const b=e.target.closest('.nb');if(b)go(b.dataset.v)});
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select'))return;if(curView==='analysis'){if(e.key==='ArrowLeft'){Analysis.go(Analysis.i-1);e.preventDefault()}if(e.key==='ArrowRight'){Analysis.go(Analysis.i+1);e.preventDefault()}}else if(curView==='play'&&Play.g){if(e.key==='ArrowLeft'){Play.nav('prev');e.preventDefault()}if(e.key==='ArrowRight'){Play.nav('next');e.preventDefault()}}});
$('#resumeBtn').onclick=()=>Play.resume();
document.addEventListener('visibilitychange',()=>{if(document.hidden&&cur===Play&&Play.g&&!Play.g.over&&Play.g.tc&&Play.g.started)Play.pause()});
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(v&&v!==curView&&VIEWS[v])go(v)});
if('serviceWorker' in navigator&&/vercel\.app$/.test(location.hostname)){try{navigator.serviceWorker.register('/sw.js').catch(()=>{})}catch(e){}}
go((location.hash.slice(1))||'home');if(!profile)showLogin(false);
}
</script>
</body>
</html>
